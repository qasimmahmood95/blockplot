name: Lighthouse

# Kept out of ci.yml on purpose. Lighthouse needs a build, a server and a
# browser, so it is slower and flakier than lint/typecheck/test, and a
# performance regression should not look like a broken test.
on:
  pull_request:
  # On push for development branches too, for the reason ci.yml records: the
  # pull_request event did not fire at all for PR #24 while every push event
  # did, so both gates were unrunnable on that branch.
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

# Keyed on the commit, not the ref, because the two events name the same commit
# differently: `github.ref` is `refs/heads/<branch>` on push and
# `refs/pull/N/merge` on pull_request, so a ref-keyed group puts them in
# different buckets and cancels neither. Measured on PR #24's merge head, which
# ran the audit twice concurrently under exactly that mistake.
concurrency:
  group: lighthouse-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The site deploys under /blockplot/ and every asset URL says so, so the
      # audit has to be served from a tree where the build sits at that path.
      # Serving dist/ at the root scores a bare HTML document with no CSS and
      # no JS — which looks like a perfect performance score and measures
      # nothing.
      - name: Stage the build at its deploy path
        run: mkdir -p .lhci-root && cp -r dist .lhci-root/blockplot
      # Thresholds live in lighthouserc.json and are set from what this runner
      # class actually reports, not from a local machine — the overview medians
      # 0.89 here against 0.97-1.00 locally. See the score table below for the
      # per-page numbers each run measured.
      - run: npx --yes @lhci/cli@0.14.x autorun
      # Every score, in the log, on pass and on fail. The artifact below is the
      # full report; this is the number you actually want when a badge goes red,
      # and it costs one step instead of a download. autorun writes the manifest
      # even when the assertions fail, so this runs after either outcome.
      - name: Report scores
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const path = ".lighthouseci/reports/manifest.json";
            if (!fs.existsSync(path)) { console.log("no manifest — collection failed"); process.exit(0); }
            const runs = JSON.parse(fs.readFileSync(path, "utf8"));
            const by = new Map();
            for (const r of runs) {
              const url = r.url.replace(/^https?:\/\/[^/]+/, "");
              if (!by.has(url)) by.set(url, []);
              by.get(url).push(r.summary);
            }
            const cats = ["performance", "accessibility", "best-practices", "seo"];
            for (const [url, summaries] of by) {
              console.log(url);
              for (const c of cats) {
                const vals = summaries.map((s) => s[c]).sort((a, b) => a - b);
                const median = vals[(vals.length - 1) >> 1];
                console.log(
                  "  " + c.padEnd(15) + "median " + median.toFixed(2) +
                  "   runs " + vals.map((v) => v.toFixed(2)).join(" "),
                );
              }
            }
          '
      # A red badge with no report is unactionable. include-hidden-files is
      # required: the directory is .lighthouseci, upload-artifact skips dotted
      # paths by default, and it had been silently uploading nothing.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14
