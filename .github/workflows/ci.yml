name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Data refreshes are pushed with GITHUB_TOKEN, which by design fires no
  # workflow — so a bot commit that lands on a PR branch leaves the newest
  # head unchecked. This lets CI be run against it on demand.
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
