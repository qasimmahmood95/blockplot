name: Data pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  # A push that changes pipeline code refreshes /data for that branch, so a
  # milestone introducing new datasets gets them seeded on its own branch by
  # the bot — hand-seeding by the developer would break commit-authorship
  # rules (see CLAUDE.md). GITHUB_TOKEN pushes never re-fire this trigger.
  push:
    paths:
      - 'pipeline/**'
      - '.github/workflows/pipeline.yml'

concurrency:
  group: pipeline

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # continue-on-error so partial output still commits when one source is
      # down (the accreted dominance series must not lose its day to an
      # unrelated outage); the final step re-fails the job for visibility.
      - run: npm run pipeline
        id: pipeline
        continue-on-error: true
      - name: Commit refreshed data as github-actions[bot]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): scheduled refresh"
            git push
            echo "PUSHED=1" >> "$GITHUB_ENV"
          fi
      # Pushes made with GITHUB_TOKEN do not fire push-triggered workflows,
      # so a data refresh has to dispatch the deploy explicitly.
      - name: Trigger deploy
        if: env.PUSHED == '1' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: Surface pipeline failure
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "One or more sources failed; partial data was committed. See the pipeline step log."
          exit 1
