name: Source probe

# Throwaway, and this is its second outing. The dev environment has no outbound
# network, so anything M17 needs to know about a live response is recalled
# rather than measured — and this repo has shipped confident prose the data
# contradicted often enough that recalled is not good enough to build on.
#
# The first run settled which fields and tickers exist. This one settles two
# things that change the code rather than the prose: how Yahoo dates a crypto
# bar, and how far a natively-quoted ETH-GBP drifts from the converted figure.
#
# Read-only: it fetches and prints. It commits nothing and touches no dataset.
on:
  workflow_dispatch:
  push:
    branches: [claude/whats-next-nq5xz6]
    paths: ['.github/workflows/probe.yml', 'scripts/probe.ts']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/probe.ts
